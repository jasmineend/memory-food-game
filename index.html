<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기억력 테스트 한번 해볼까용?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF4E0;
    --ink: #4A2C1A;
    --accent: #FF7A9A;
    --accent-dark: #E5567A;
    --card-back: #FFB4C6;
    --card-face: #FFFDF6;
    --shadow: 0 4px 0 rgba(74,44,26,.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Jua", sans-serif;
    display: flex; justify-content: center;
    background-image: radial-gradient(#ffe2b8 2px, transparent 2px);
    background-size: 26px 26px;
  }
  #app { width: 100%; max-width: 560px; padding: 16px; display: flex; flex-direction: column; min-height: 100%; }
  .screen { display: none; flex: 1; flex-direction: column; align-items: center; }
  .screen.active { display: flex; }
  h1 { font-size: 2.1rem; margin: 18px 0 4px; text-align: center; line-height: 1.2; }
  .sub { margin: 0 0 18px; opacity: .8; text-align: center; }
  .mascots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 360px; margin: 6px 0 20px; }
  .mascots div { background: var(--card-face); border-radius: 16px; box-shadow: var(--shadow); padding: 6px 4px 8px; text-align: center; font-size: .85rem; }
  .mascots svg { width: 100%; max-width: 72px; height: auto; display: block; margin: 0 auto; }
  .levels { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 360px; }
  button { font-family: "Jua", sans-serif; font-size: inherit; color: inherit; cursor: pointer; }
  .btn {
    border: 0; border-radius: 18px; padding: 14px 18px; font-size: 1.15rem;
    background: var(--accent); color: #fff; box-shadow: 0 5px 0 var(--accent-dark);
    min-height: 48px; transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-dark); }
  .btn.alt { background: #fff; color: var(--ink); box-shadow: 0 5px 0 #d8c3a5; }
  .btn.alt:active { box-shadow: 0 1px 0 #d8c3a5; }
  .level { display: flex; justify-content: space-between; align-items: center; text-align: left; }
  .level small { opacity: .85; font-size: .85rem; }
  .level .best { font-size: .8rem; opacity: .9; }

  .hud { display: flex; gap: 8px; width: 100%; align-items: center; margin-bottom: 10px; }
  .stat { flex: 1; background: #fff; border-radius: 14px; padding: 6px 10px; box-shadow: var(--shadow); text-align: center; font-size: .8rem; }
  .stat b { display: block; font-size: 1.25rem; }
  .icon-btn { width: 48px; height: 48px; border-radius: 14px; border: 0; background: #fff; box-shadow: var(--shadow); font-size: 1.3rem; }

  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; perspective: 900px; margin: 8px 0; }
  .card { position: relative; aspect-ratio: 1 / 1; border: 0; padding: 0; background: none; min-width: 44px; min-height: 44px; }
  .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .45s; }
  .card.flipped .inner, .card.matched .inner { transform: rotateY(180deg); }
  .side { position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .back { background: var(--card-back); background-image: radial-gradient(#fff8 3px, transparent 3px); background-size: 16px 16px; font-size: 2rem; color: #fff; }
  .front { background: var(--card-face); transform: rotateY(180deg); }
  .front svg { width: 88%; height: 88%; }
  .card.matched .front { background: #E8FFE3; animation: pop .5s; }
  .card:focus-visible .side { outline: 4px solid #4A90E2; }
  @keyframes pop { 0%{transform:rotateY(180deg) scale(1);} 40%{transform:rotateY(180deg) scale(1.15);} 100%{transform:rotateY(180deg) scale(1);} }
  .card.shake .inner { animation: shake .3s; }
  @keyframes shake { 0%,100%{transform:rotateY(180deg) translateX(0);} 25%{transform:rotateY(180deg) translateX(-5px);} 75%{transform:rotateY(180deg) translateX(5px);} }

  .bubble {
    min-height: 44px; margin-top: 6px; padding: 8px 16px; background: #fff; border-radius: 20px;
    box-shadow: var(--shadow); font-size: 1rem; text-align: center; opacity: 0; transition: opacity .2s;
  }
  .bubble.show { opacity: 1; }
  .row { display: flex; gap: 10px; margin-top: 14px; width: 100%; max-width: 360px; }
  .row .btn { flex: 1; }

  .result-box { background: #fff; border-radius: 24px; box-shadow: var(--shadow); padding: 24px; text-align: center; width: 100%; max-width: 360px; margin-top: 20px; }
  .stars { font-size: 2.6rem; letter-spacing: 6px; margin: 6px 0; }
  .result-box svg { width: 110px; }
  .new-record { color: var(--accent-dark); font-size: 1.1rem; min-height: 1.4em; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  @media (max-width: 380px) { .board { gap: 7px; } h1 { font-size: 1.8rem; } }
  @media (prefers-reduced-motion: reduce) { .inner { transition: none; } .card.matched .front, .card.shake .inner { animation: none; } }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="app">

  <section id="screen-start" class="screen active">
    <h1>🍔 기억력 테스트<br>한번 해볼까용? 🍩</h1>
    <p class="sub">같은 친구를 찾아 카드를 뒤집어요!</p>
    <div class="mascots" id="mascots"></div>
    <div class="levels" id="levels"></div>
  </section>

  <section id="screen-game" class="screen">
    <div class="hud">
      <button class="icon-btn" id="btn-home" aria-label="처음으로">🏠</button>
      <div class="stat">시도<b id="moves">0</b></div>
      <div class="stat">시간<b id="time">0:00</b></div>
      <button class="icon-btn" id="btn-restart" aria-label="다시하기">🔄</button>
      <button class="icon-btn" id="btn-mute" aria-label="소리 켜기/끄기">🔊</button>
    </div>
    <div class="board" id="board"></div>
    <div class="bubble" id="bubble" aria-live="polite"></div>
  </section>

  <section id="screen-result" class="screen">
    <div class="result-box">
      <h1 style="margin-top:0">클리어! 🎉</h1>
      <div id="result-mascot"></div>
      <div class="stars" id="stars"></div>
      <p id="result-text"></p>
      <div class="new-record" id="new-record"></div>
    </div>
    <div class="row">
      <button class="btn" id="btn-again">다시하기</button>
      <button class="btn alt" id="btn-level">난이도 변경</button>
    </div>
  </section>
</div>

<script>
'use strict';

/* ---------- 캐릭터 SVG ---------- */
const INK = '#4A2C1A';
function face(cx, cy, kind) {
  const eyes = kind === 'sleepy'
    ? `<path d="M${cx-15} ${cy} q4 3.5 8 0 M${cx+7} ${cy} q4 3.5 8 0" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`
    : `<circle cx="${cx-11}" cy="${cy}" r="3.3" fill="${INK}"/><circle cx="${cx+11}" cy="${cy}" r="3.3" fill="${INK}"/>
       <circle cx="${cx-10}" cy="${cy-1.2}" r="1" fill="#fff"/><circle cx="${cx+12}" cy="${cy-1.2}" r="1" fill="#fff"/>`;
  const mouths = {
    happy: `<path d="M${cx-7} ${cy+7} Q${cx} ${cy+19} ${cx+7} ${cy+7} Z" fill="#C0392B" stroke="${INK}" stroke-width="1.5" stroke-linejoin="round"/>`,
    calm:  `<path d="M${cx-6} ${cy+9} Q${cx} ${cy+14} ${cx+6} ${cy+9}" stroke="${INK}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`,
    shy:   `<path d="M${cx-6} ${cy+11} q3 -3 6 0 t6 0" stroke="${INK}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`
  };
  const cheeks = `<circle cx="${cx-19}" cy="${cy+8}" r="4.5" fill="#FF8FA8" opacity=".55"/><circle cx="${cx+19}" cy="${cy+8}" r="4.5" fill="#FF8FA8" opacity=".55"/>`;
  return eyes + cheeks + (mouths[kind === 'sleepy' ? 'calm' : kind] || mouths.calm);
}
const svg = body => `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${body}</svg>`;

const CHARACTERS = [
  { id: 'burger', name: '버기', food: '햄버거', line: '든든하게 찾았네~ 느긋느긋!',
    svg: svg(`
      <path d="M13 54 Q13 12 50 12 Q87 12 87 54 Z" fill="#E8A33D" stroke="#B9782A" stroke-width="2"/>
      <circle cx="30" cy="24" r="1.8" fill="#FFF1C9"/><circle cx="50" cy="19" r="1.8" fill="#FFF1C9"/><circle cx="70" cy="24" r="1.8" fill="#FFF1C9"/>
      <path d="M10 54 q6 9 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t8 0 v4 H10Z" fill="#6CC24A" stroke="#4A9A2E" stroke-width="1.5"/>
      <rect x="12" y="60" width="76" height="13" rx="6.5" fill="#7A4A2A"/>
      <path d="M14 76 H86 Q86 90 72 90 H28 Q14 90 14 76Z" fill="#E8A33D" stroke="#B9782A" stroke-width="2"/>
      ${face(50, 36, 'sleepy')}`) },
  { id: 'pizza', name: '피쟈', food: '피자', line: '헤헷! 찾았다, 짜잔~!',
    svg: svg(`
      <path d="M50 92 L10 22 Q50 6 90 22 Z" fill="#FFD54A" stroke="#E2A400" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M10 22 Q50 6 90 22 L86 30 Q50 16 14 30 Z" fill="#E8A33D" stroke="#B9782A" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="30" cy="44" r="5.5" fill="#D93A2B"/><circle cx="68" cy="42" r="5.5" fill="#D93A2B"/><circle cx="50" cy="76" r="4.5" fill="#D93A2B"/>
      ${face(50, 46, 'happy')}`) },
  { id: 'donut', name: '도니', food: '도넛', line: '달콤한 성공! 야호~',
    svg: svg(`
      <circle cx="50" cy="52" r="40" fill="#D9A066" stroke="#A9743A" stroke-width="2"/>
      <path d="M50 16 C72 14 90 30 88 50 C90 60 84 66 80 62 C78 72 70 74 66 68 C62 78 54 78 50 72 C46 78 36 76 34 68 C28 72 20 68 20 60 C10 56 10 34 24 26 C32 18 40 16 50 16Z" fill="#FF9EBB" stroke="#E5567A" stroke-width="2"/>
      <circle cx="50" cy="52" r="11" fill="#FFFDF6" stroke="#E5567A" stroke-width="2"/>
      <rect x="26" y="27" width="7" height="2.8" rx="1.4" fill="#fff" transform="rotate(-30 29 28)"/>
      <rect x="66" y="26" width="7" height="2.8" rx="1.4" fill="#FFE066" transform="rotate(25 70 27)"/>
      <rect x="74" y="44" width="7" height="2.8" rx="1.4" fill="#8EE4C6" transform="rotate(60 77 45)"/>
      <rect x="18" y="45" width="7" height="2.8" rx="1.4" fill="#FFE066" transform="rotate(-70 21 46)"/>
      <circle cx="35" cy="40" r="3.3" fill="${INK}"/><circle cx="65" cy="40" r="3.3" fill="${INK}"/>
      <circle cx="36" cy="38.8" r="1" fill="#fff"/><circle cx="66" cy="38.8" r="1" fill="#fff"/>
      <path d="M40 72 Q50 82 60 72 Z" fill="#C0392B" stroke="${INK}" stroke-width="1.5" stroke-linejoin="round"/>`) },
  { id: 'icecream', name: '스크미', food: '아이스크림', line: '음… 차분하게, 잘 찾았어.',
    svg: svg(`
      <path d="M32 54 H68 L50 94 Z" fill="#E0A96D" stroke="#B9782A" stroke-width="2" stroke-linejoin="round"/>
      <path d="M38 62 L58 82 M50 58 L62 76 M34 70 L46 86" stroke="#C88A4E" stroke-width="1.5"/>
      <path d="M22 46 Q22 12 50 12 Q78 12 78 46 Q78 58 66 56 Q62 64 56 56 Q50 62 44 56 Q38 64 34 56 Q22 58 22 46Z" fill="#8EE4C6" stroke="#48B592" stroke-width="2"/>
      <path d="M26 44 Q26 36 30 30" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".6"/>
      <circle cx="50" cy="8" r="0" fill="none"/>
      ${face(50, 34, 'calm')}
      <ellipse cx="72" cy="61" rx="4" ry="6" fill="#9AD8F5" stroke="#5FB4E0" stroke-width="1.5"/>`) },
  { id: 'cake', name: '케키', food: '케이크', line: '와~ 우리 짝이었구나, 귀여워!',
    svg: svg(`
      <rect x="14" y="44" width="72" height="42" rx="8" fill="#FFFFFF" stroke="#E5B5C2" stroke-width="2"/>
      <rect x="14" y="62" width="72" height="8" fill="#FFB4C6"/>
      <path d="M12 46 Q12 32 26 34 Q30 26 40 30 Q46 22 56 30 Q66 26 72 34 Q88 32 88 46 Q84 54 78 48 Q72 56 66 48 Q58 56 50 48 Q42 56 34 48 Q26 56 22 48 Q14 54 12 46Z" fill="#FFD9E3" stroke="#E5B5C2" stroke-width="2"/>
      <path d="M50 30 Q38 30 40 20 Q44 12 50 16 Q56 12 60 20 Q62 30 50 30Z" fill="#E63946" stroke="#B02030" stroke-width="1.5" transform="translate(-2 -2)"/>
      <path d="M46 12 l4 4 l4 -4" stroke="#4A9A2E" stroke-width="2.4" fill="none" stroke-linecap="round" transform="translate(-2 -2)"/>
      ${face(50, 62, 'happy').replace('cy="70"', 'cy="70"')}`) },
  { id: 'cookie', name: '쿠쿠', food: '쿠키', line: '저… 찾았어요. 다행이에요.',
    svg: svg(`
      <path d="M50 10 C66 8 78 16 86 28 C94 42 92 62 82 76 C72 90 54 94 40 90 C24 86 12 74 10 58 C8 40 18 22 32 14 C38 11 44 10 50 10Z" fill="#DDB98A" stroke="#B48A55" stroke-width="2.5"/>
      <ellipse cx="26" cy="36" rx="4" ry="3.2" fill="#6B3E22"/><ellipse cx="74" cy="30" rx="4.5" ry="3.4" fill="#6B3E22"/>
      <ellipse cx="80" cy="60" rx="4" ry="3.2" fill="#6B3E22"/><ellipse cx="22" cy="64" rx="4.2" ry="3.2" fill="#6B3E22"/>
      <ellipse cx="46" cy="22" rx="3.8" ry="3" fill="#6B3E22"/><ellipse cx="54" cy="82" rx="4.4" ry="3.3" fill="#6B3E22"/>
      <ellipse cx="72" cy="78" rx="3.4" ry="2.8" fill="#6B3E22"/>
      ${face(50, 50, 'shy')}`) },
  // 어려움 모드용 추가 캐릭터 (PRD 예시: 치킨, 초밥 — 이름/성격은 임시)
  { id: 'chicken', name: '치키', food: '치킨', line: '바삭바삭! 척척 찾았지!',
    svg: svg(`
      <rect x="66" y="66" width="8" height="24" rx="4" fill="#FFF7E8" stroke="#D9C7A0" stroke-width="2" transform="rotate(-40 70 78)"/>
      <circle cx="78" cy="88" r="6" fill="#FFF7E8" stroke="#D9C7A0" stroke-width="2"/><circle cx="88" cy="80" r="6" fill="#FFF7E8" stroke="#D9C7A0" stroke-width="2"/>
      <path d="M12 38 C12 12 46 6 62 24 C76 40 70 62 52 70 C32 78 12 62 12 38Z" fill="#E39A2D" stroke="#B36F12" stroke-width="2.5"/>
      <path d="M22 26 Q30 16 42 16" stroke="#F8C766" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      ${face(38, 42, 'happy')}`) },
  { id: 'sushi', name: '스시', food: '초밥', line: '깔끔하게 성공했어요.',
    svg: svg(`
      <rect x="12" y="48" width="76" height="34" rx="15" fill="#FFFFFF" stroke="#D9D2C5" stroke-width="2"/>
      <path d="M8 50 Q8 26 34 30 Q50 22 66 30 Q92 26 92 50 Q50 60 8 50Z" fill="#FF8A5B" stroke="#D9622F" stroke-width="2.5"/>
      <path d="M22 38 Q30 46 40 42 M46 34 Q54 42 64 38 M70 40 Q76 46 84 44" stroke="#FFC9B0" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="44" y="30" width="12" height="52" fill="#2E3A3A" opacity=".9"/>
      <circle cx="30" cy="66" r="3.2" fill="${INK}"/><circle cx="70" cy="66" r="3.2" fill="${INK}"/>
      <path d="M46 74 Q50 78 54 74" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>`) }
];

/* ---------- 난이도 ---------- */
const LEVELS = {
  easy:   { label: '쉬움',  kinds: 4, desc: '4종 · 8장' },
  normal: { label: '보통',  kinds: 6, desc: '6종 · 12장' },
  hard:   { label: '어려움', kinds: 8, desc: '8종 · 16장' }
};

/* ---------- 유틸 ---------- */
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* ---------- 사운드 ---------- */
let muted = store.get('memory.muted', false);
let actx;
function tone(freq, dur = .12, type = 'sine', when = 0, vol = .12) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch {}
}
const sfx = {
  flip: () => tone(520, .07, 'triangle'),
  match: () => { tone(660, .12, 'sine'); tone(880, .18, 'sine', .1); },
  miss: () => tone(220, .18, 'sawtooth', 0, .06),
  win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, 'triangle', i * .13))
};
function updateMuteBtn() { $('btn-mute').textContent = muted ? '🔇' : '🔊'; }

/* ---------- 상태 ---------- */
let level = 'normal', deck = [], first = null, lock = false;
let moves = 0, matched = 0, seconds = 0, timer = null, started = false, bubbleTimer = null;

function show(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('screen-' + name).classList.add('active');
}

/* ---------- 시작 화면 ---------- */
function bestOf(l) { return store.get('memory.best.' + l, null); }
function renderStart() {
  $('mascots').innerHTML = CHARACTERS.slice(0, 6).map(c => `<div>${c.svg}${c.name}</div>`).join('');
  $('levels').innerHTML = Object.entries(LEVELS).map(([k, v]) => {
    const b = bestOf(k);
    return `<button class="btn level" data-level="${k}"><span>${v.label}<br><small>${v.desc}</small></span>
      <span class="best">${b ? `🏆 ${b.moves}번 · ${fmt(b.time)}` : ''}</span></button>`;
  }).join('');
  $('levels').querySelectorAll('button').forEach(b => b.onclick = () => startGame(b.dataset.level));
}

/* ---------- 게임 ---------- */
function startGame(l) {
  level = l;
  clearInterval(timer);
  const kinds = LEVELS[l].kinds;
  // 쉬움/보통은 기본 6종 중에서, 어려움은 추가 캐릭터 포함 8종 사용
  const pool = l === 'hard' ? CHARACTERS : CHARACTERS.slice(0, 6);
  const picked = shuffle(pool).slice(0, kinds);
  deck = shuffle([...picked, ...picked].map((c, i) => ({ ...c, uid: i })));
  first = null; lock = false; moves = 0; matched = 0; seconds = 0; started = false;
  $('moves').textContent = 0; $('time').textContent = '0:00';
  $('bubble').classList.remove('show');
  $('board').innerHTML = deck.map((c, i) => `
    <button class="card" data-i="${i}" aria-label="카드 ${i + 1}번, 뒷면">
      <div class="inner">
        <div class="side back">🍴</div>
        <div class="side front">${c.svg}</div>
      </div></button>`).join('');
  $('board').querySelectorAll('.card').forEach(el => el.onclick = () => flip(el));
  show('game');
}

function flip(el) {
  if (lock || el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if (!started) { started = true; timer = setInterval(() => { seconds++; $('time').textContent = fmt(seconds); }, 1000); }
  sfx.flip();
  el.classList.add('flipped');
  const c = deck[+el.dataset.i];
  el.setAttribute('aria-label', `${c.name} 카드`);
  if (!first) { first = el; return; }

  moves++; $('moves').textContent = moves;
  const a = first, b = el; first = null;
  if (deck[+a.dataset.i].id === c.id) {
    [a, b].forEach(x => { x.classList.remove('flipped'); x.classList.add('matched'); });
    matched++; sfx.match(); say(c);
    if (matched === LEVELS[level].kinds) setTimeout(win, 900);
  } else {
    lock = true; sfx.miss();
    setTimeout(() => {
      [a, b].forEach(x => { x.classList.add('shake'); });
    }, 350);
    setTimeout(() => {
      [a, b].forEach(x => { x.classList.remove('flipped', 'shake'); x.setAttribute('aria-label', `카드 ${+x.dataset.i + 1}번, 뒷면`); });
      lock = false;
    }, 1000);
  }
}

function say(c) {
  const b = $('bubble');
  b.textContent = `${c.name}: "${c.line}"`;
  b.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => b.classList.remove('show'), 2200);
}

/* ---------- 결과 ---------- */
function starsFor(m, pairs) { return m <= pairs * 1.5 ? 3 : m <= pairs * 2.5 ? 2 : 1; }
function win() {
  clearInterval(timer);
  const pairs = LEVELS[level].kinds, s = starsFor(moves, pairs);
  $('stars').textContent = '★'.repeat(s) + '☆'.repeat(3 - s);
  $('stars').style.color = '#FFB400';
  $('result-text').innerHTML = `${LEVELS[level].label} · 시도 <b>${moves}번</b> · 시간 <b>${fmt(seconds)}</b>`;
  const best = bestOf(level);
  const better = !best || moves < best.moves || (moves === best.moves && seconds < best.time);
  $('new-record').textContent = better ? '🏆 최고 기록 갱신!' : '';
  if (better) store.set('memory.best.' + level, { moves, time: seconds });
  $('result-mascot').innerHTML = shuffle(deck)[0].svg;
  show('result'); sfx.win(); confetti();
}

/* ---------- 컨페티 ---------- */
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('confetti'), cx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#FF7A9A', '#FFD54A', '#8EE4C6', '#9AD8F5', '#E8A33D'];
  const ps = Array.from({ length: 120 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .4, r: 4 + Math.random() * 5,
    vx: -1.5 + Math.random() * 3, vy: 2 + Math.random() * 3.5, c: colors[Math.floor(Math.random() * colors.length)], a: Math.random() * 6
  }));
  const end = performance.now() + 2600;
  (function frame(t) {
    cx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += .1; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cx.restore(); });
    if (t < end) requestAnimationFrame(frame); else cx.clearRect(0, 0, cv.width, cv.height);
  })(performance.now());
}

/* ---------- 이벤트 ---------- */
$('btn-home').onclick = () => { clearInterval(timer); renderStart(); show('start'); };
$('btn-restart').onclick = () => startGame(level);
$('btn-again').onclick = () => startGame(level);
$('btn-level').onclick = () => { renderStart(); show('start'); };
$('btn-mute').onclick = () => { muted = !muted; store.set('memory.muted', muted); updateMuteBtn(); };

updateMuteBtn();
renderStart();
</script>
